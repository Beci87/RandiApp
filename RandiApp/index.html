<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Egy visszautasíthatatlan ajánlat...</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="card" id="mainCard">
    <h1>Szia! ✨</h1>
    <p>Lenne egy nagyon fontos kérdésem hozzád... Eljönnél velem randizni?</p>

    <div class="btn-container">
        <button id="yesBtn" onclick="chooseFoodPage()">IGEN! 😍</button>
        <button id="noBtn" onmouseover="escapeButton()" onclick="touchEscape()">Nem 😢</button>
    </div>
</div>

<script>
    const noBtn = document.getElementById('noBtn');
    const mainCard = document.getElementById('mainCard');

    let valaszok = {
        etel: '',
        ital: '',
        datumIdo: ''
    };

    // Helyszínek és Google Térkép linkek
    const helyszinek = {
        "Pizza 🍕": { nev: "La Terrazza étterem", link: "https://google.com" },
        "Sushi 🍣": { nev: "Wok'n Go", link: "https://google.com" },
        "Burger 🍔": { nev: "Simon's Burger (Pláza/Korzó)", link: "https://google.com" },
        "Desszert 🍰": { nev: "Stühmer cukrászda", link: "https://google.com" },
        "Bor 🍷": { nev: "Continent Wine&Cafe", link: "https://google.com" },
        "Koktél 🍹": { nev: "Hedonist étterem", link: "https://google.com" },
        "Sör 🍺": { nev: "Gedeon söröző", link: "https://google.com" },
        "Kávé/Tea ☕": { nev: "Cafe Frei", link: "https://google.com" }
    };

    function escapeButton() {
        const x = Math.random() * (window.innerWidth - 150);
        const y = Math.random() * (window.innerHeight - 100);
        noBtn.style.position = 'fixed';
        noBtn.style.left = x + 'px';
        noBtn.style.top = y + 'px';
    }

    function touchEscape() {
        alert("A 'Nem' gomb sajnos elromlott, de az Igen tökéletesen működik! 😉");
        chooseFoodPage();
    }

    // 1. KÉRDÉS: ÉTEL VÁLASZTÁS
    function chooseFoodPage() {
        mainCard.innerHTML = "<h1>Szuper! 😍 Micsoda öröm!</h1>" +
            "<p>Első lépés: Milyen ételt ennél szívesen?</p>" +
            "<div class='options-grid'>" +
                "<div class='option-card' onclick=\"saveFood('Pizza 🍕')\"><span>🍕</span>Pizza</div>" +
                "<div class='option-card' onclick=\"saveFood('Sushi 🍣')\"><span>🍣</span>Sushi</div>" +
                "<div class='option-card' onclick=\"saveFood('Burger 🍔')\"><span>🍔</span>Burger</div>" +
                "<div class='option-card' onclick=\"saveFood('Desszert 🍰')\"><span>🍰</span>Süti / Desszert</div>" +
            "</div>" +
            "<button id='submitBtn' style='margin-top: 20px;' onclick=\"saveFood('Csak inni szeretnék 🥂')\">Nem vagyok éhes, csak inni szeretnék! 🥂</button>";
    }

    function saveFood(food) {
        valaszok.etel = food;
        chooseDrinkPage();
    }

    // 2. KÉRDÉS: ITAL VÁLASZTÁS
    function chooseDrinkPage() {
        mainCard.innerHTML = "<h1>Koccintsunk is! 🥂</h1>" +
            "<p>Második lépés: Mit innál szívesen?</p>" +
            "<div class='options-grid'>" +
                "<div class='option-card' onclick=\"saveDrink('Bor 🍷')\"><span>🍷</span>Finom Bor</div>" +
                "<div class='option-card' onclick=\"saveDrink('Koktél 🍹')\"><span>🍹</span>Koktél</div>" +
                "<div class='option-card' onclick=\"saveDrink('Sör 🍺')\"><span>🍺</span>Kézműves Sör</div>" +
                "<div class='option-card' onclick=\"saveDrink('Kávé/Tea ☕')\"><span>☕</span>Kávé / Tea</div>" +
            "</div>";
    }

    function saveDrink(drink) {
        valaszok.ital = drink;
        chooseDatePage();
    }

    // 3. KÉRDÉS: IDŐPONT
    function chooseDatePage() {
        mainCard.innerHTML = "<h1>Mikor találkozzunk? 📅</h1>" +
            "<p>Utolsó lépés: Válaszd ki a legtökéletesebb időpontot!</p>" +
            "<div class='time-container' style='display: flex; flex-direction: column; gap: 15px; margin-top: 20px;'>" +
                "<div style='text-align: left;'>" +
                    "<label style='display: block; color: #590d22; font-weight: bold; margin-bottom: 5px;'>Melyik nap lenne a legjobb?</label>" +
                    "<select id='dateSelect' onchange='toggleCustomDate()' style='width: 100%; padding: 12px; border: 2px solid #ffb3c6; border-radius: 10px; font-size: 1rem; font-weight: bold; color: #590d22; outline: none; background: white; cursor: pointer;'>" +
                        "<option value='Most péntek este 🗓️'>Most péntek este 🗓️</option>" +
                        "<option value='Szombat délután ☀️'>Szombat délután ☀️</option>" +
                        "<option value='Vasárnapi brunch ☕'>Vasárnapi kellemes brunch ☕</option>" +
                        "<option value='egyedi'>Amikor neked a legalkalmasabb... ✨</option>" +
                    "</select>" +
                "</div>" +
                "<div id='customDateContainer' style='display: none; text-align: left;'>" +
                    "<label style='display: block; color: #590d22; font-weight: bold; margin-bottom: 5px;'>Válaszd ki a pontos napot a naptárból:</label>" +
                    "<input type='date' id='customDateInput' style='width: 100%; padding: 12px; border: 2px solid #ffb3c6; border-radius: 10px; font-size: 1rem; font-weight: bold; color: #590d22; outline: none; background: white; cursor: pointerFilter;'>" +
                "</div>" +
                "<div style='display: flex; gap: 15px;'>" +
                    "<div style='flex: 1; text-align: left;'>" +
                        "<label style='display: block; color: #590d22; font-weight: bold; margin-bottom: 5px;'>Hány órakor?</label>" +
                        "<select id='hourInput' style='width: 100%; padding: 12px; border: 2px solid #ffb3c6; border-radius: 10px; font-size: 1rem; font-weight: bold; color: #590d22; outline: none; background: white; cursor: pointer;'>" +
                            "<option value='16:'>16 óra</option>" +
                            "<option value='17:'>17 óra</option>" +
                            "<option value='18:'>18 óra</option>" +
                            "<option value='19:' selected>19 óra</option>" +
                            "<option value='20:'>20 óra</option>" +
                            "<option value='21:'>21 óra</option>" +
                        "</select>" +
                    "</div>" +
                    "<div style='flex: 1; text-align: left;'>" +
                        "<label style='display: block; color: #590d22; font-weight: bold; margin-bottom: 5px;'>Perc?</label>" +
                        "<select id='minuteInput' style='width: 100%; padding: 12px; border: 2px solid #ffb3c6; border-radius: 10px; font-size: 1rem; font-weight: bold; color: #590d22; outline: none; background: white; cursor: pointer;'>" +
                            "<option value='00'>00</option>" +
                            "<option value='15'>15</option>" +
                            "<option value='30' selected>30</option>" +
                            "<option value='45'>45</option>" +
                        "</select>" +
                    "</div>" +
                "</div>" +
                "<button id='submitBtn' onclick='finalizeRandi()'>Randi véglegesítése 🚀</button>" +
            "</div>";

        const today = new Date().toISOString().split('T');
        document.getElementById('customDateInput').min = today;
    }

    function toggleCustomDate() {
        const selectValue = document.getElementById('dateSelect').value;
        const customContainer = document.getElementById('customDateContainer');
        if (selectValue === 'egyedi') {
            customContainer.style.display = 'block';
        } else {
            customContainer.style.display = 'none';
        }
    }

    // VÉGSŐ LOGIKA ÉS KÜLDÉS
    function finalizeRandi() {
        const nap = document.getElementById('dateSelect').value;
        const ora = document.getElementById('hourInput').value;
        const perc = document.getElementById('minuteInput').value;

        let veglegesNap = nap;
        if (nap === 'egyedi') {
            const egyediDatum = document.getElementById('customDateInput').value;
            if (!egyediDatum) {
                alert("Kérlek, válaszd ki a pontos napot a naptárból! 😊");
                return;
            }
            veglegesNap = "Egyedi dátum (" + egyediDatum + ")";
        }

        valaszok.datumIdo = veglegesNap + " " + ora + perc;

        let veglegesHelyszin = "";
        let terkepLink = "";

        if (valaszok.etel === "Csak inni szeretnék 🥂") {
            veglegesHelyszin = helyszinek[valaszok.ital].nev;
            terkepLink = helyszinek[valaszok.ital].link;
        } else {
            veglegesHelyszin = helyszinek[valaszok.etel].nev;
            terkepLink = helyszinek[valaszok.etel].link;
        }
                // Atombiztos küldési szöveg összefűzés sima macskakörmökkel
            const kuldesiBody = "etel=" + encodeURIComponent(valaszok.etel) +
                               "&ital=" + encodeURIComponent(valaszok.ital) +
                               "&idopont=" + encodeURIComponent(valaszok.datumIdo);

            fetch('/mentes', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded; charset=UTF-8' },
                body: kuldesiBody
            })
            .then(response => {
                if (response.ok) {
                    mainCard.innerHTML = "<h1>Szuper! Randi lefoglalva! 🎉</h1>" +
                        "<p>Mindent elintéztem, a megbeszélt időpont:</p>" +
                        "<p style='font-weight: bold; color: #ff4d6d; font-size: 1.1rem; margin: 10px 0;'>" + valaszok.datumIdo + "</p>" +
                        "<p>A találkozó helyszíne:</p>" +
                        "<p style='font-weight: bold; color: #590d22; font-size: 1.2rem; margin: 5px 0;'>✨ " + veglegesHelyszin + " ✨</p>" +
                        "<a href='" + terkepLink + "' target='_blank' style='display: inline-block; background-color: #38b000; color: white; padding: 12px 25px; font-weight: bold; text-decoration: none; border-radius: 25px; margin: 20px 0; box-shadow: 0 4px 15px rgba(56, 176, 0, 0.3);'>" +
                            "Útvonalterv megnyitása 🗺️" +
                        "</a>" +
                        "<p style='font-style: italic; color: #7a1f3d;'>Nagyon várom már! 🥰</p>";
                } else {
                    alert("Szerver hiba történt a mentés során... 😢");
                }
            })
            .catch(error => {
                console.error("Hiba:", error);
                alert("Nem sikerült elérni a Java szervert.");
            });
        }
    }
</script>
